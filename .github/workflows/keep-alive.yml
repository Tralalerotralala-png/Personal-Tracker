
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping wallpaper snapshot endpoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret"
            exit 1
          fi
          auth_header=()
          case "${SUPABASE_ANON_KEY}" in eyJ*) auth_header=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}");; esac
          code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/wallpaper_snapshot" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H 'Content-Type: application/json' \
            "${auth_header[@]}" \
            --data '{}')
          if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
            echo "Supabase responded with HTTP $code (project is awake)"
          else
            echo "Supabase request failed with HTTP $code"
            exit 1
          fi
