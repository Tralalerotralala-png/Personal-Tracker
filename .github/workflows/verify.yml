name: Verify Personal Tracker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Run automated tests
        run: node --test
      - name: Verify Wallpaper Engine build
        run: node scripts/build-wallpaper.mjs

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run mobile and desktop browser smoke test
        run: |
          python -m http.server 8099 --bind 127.0.0.1 >/tmp/tracker-http.log 2>&1 &
          python tests/ui-regression.py

  database-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tracker_test
          POSTGRES_USER: tracker_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: test_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Test owner-only RLS and privileged wallpaper RPC in disposable Postgres
        run: |
          set -euo pipefail
          for sql in \
            tests/sql/owner-guard-fixture.sql \
            supabase/owner-policy-hardening.sql \
            supabase/owner-policy-hardening.sql \
            tests/sql/owner-guard-assertions.sql; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U tracker_test -d tracker_test -f "$sql"
          done
