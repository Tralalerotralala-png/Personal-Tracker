name: Verify Personal Tracker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Run automated tests
        run: node --test
      - name: Verify Wallpaper Engine build
        run: node scripts/build-wallpaper.mjs

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run mobile and desktop browser smoke test
        run: |
          python -m http.server 8099 --bind 127.0.0.1 >/tmp/tracker-http.log 2>&1 &
          python tests/ui-regression.py
