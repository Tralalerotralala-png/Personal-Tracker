<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Tracker - Stage 1 check</title>
<style>
  body { font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #14161c; color: #d8dce6; margin: 0; padding: 16px; max-width: 760px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  section { border: 2px solid #3a4052; padding: 12px; margin: 0 0 14px; background: #1a1d26; }
  h2 { font-size: 13px; margin: 0 0 8px; color: #8fa0c8; text-transform: uppercase; letter-spacing: .08em; }
  input, button { font: inherit; padding: 6px 10px; border: 2px solid #3a4052; background: #232736; color: inherit; }
  button { cursor: pointer; } button:hover { border-color: #8fa0c8; }
  input { min-width: 0; } .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; align-items: center; }
  .pill { padding: 2px 8px; border: 2px solid; display: inline-block; }
  .synced, .local { color: #6fd36f; } .syncing, .idle { color: #e0c050; }
  .offline, .unreachable, .error, .auth-required { color: #ff7a7a; }
  table { border-collapse: collapse; } td { padding: 2px 14px 2px 0; }
  pre { white-space: pre-wrap; margin: 6px 0 0; color: #a8b4d0; }
  .hidden { display: none; } .err { color: #ff7a7a; }
</style>
</head>
<body>
<h1>Personal Tracker - Stage 1 check</h1>

<section>
  <h2>Status</h2>
  <div>Mode: <b id="mode">starting...</b> &nbsp; Sync: <span id="sync" class="pill">-</span></div>
  <div id="syncdetail"></div>
  <div class="row">
    <button id="btn-sync" class="hidden">Sync now</button>
    <button id="btn-resync" class="hidden">Full re-download</button>
    <button id="btn-signout" class="hidden">Sign out</button>
  </div>
</section>

<section id="login" class="hidden">
  <h2>Sign in</h2>
  <div class="row">
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
    <button id="btn-link">Email me a link / code</button>
  </div>
  <div class="row">
    <input id="code" inputmode="numeric" placeholder="6-digit code from the email">
    <button id="btn-code">Verify code</button>
  </div>
  <div id="login-msg"></div>
</section>

<section>
  <h2>Rows in the local cache</h2>
  <table id="counts"></table>
</section>

<section>
  <h2>Try it</h2>
  <div class="row">
    <input id="new-name" placeholder="New item name">
    <button id="btn-add">Add item</button>
  </div>
  <div class="row">
    <input id="where" placeholder="Where is it? (e.g. headlamp, shed)">
  </div>
  <pre id="where-out"></pre>
</section>

<section>
  <h2>Backup</h2>
  <div class="row">
    <button id="btn-export">Download backup</button>
    <input id="file" type="file" accept="application/json">
    <button id="btn-import">Import (merge)</button>
  </div>
  <pre id="backup-out"></pre>
</section>

<script type="module">
import { initData } from './js/data/app-data.js';
import { exportAll, importAll, downloadBackup } from './js/data/backup.js';
import { whereIs } from './js/data/inventory-logic.js';
import { TABLE_NAMES } from './js/data/schema.js';

const $ = (id) => document.getElementById(id);
const show = (id, on) => $(id).classList.toggle('hidden', !on);

let ctx;
try {
  ctx = await initData();
} catch (err) {
  $('mode').textContent = 'failed to start';
  document.body.insertAdjacentHTML('beforeend', `<pre class="err">${err.stack || err}</pre>`);
  throw err;
}
const { mode, store, auth } = ctx;
$('mode').textContent = mode === 'local' ? 'local-only (no config.js) - sample data' : 'cloud (Supabase)';

// ---- rendering ---------------------------------------------------------------
async function renderCounts() {
  const rows = [];
  for (const t of TABLE_NAMES) rows.push(`<tr><td>${t}</td><td>${(await store.list(t)).length}</td></tr>`);
  $('counts').innerHTML = rows.join('');
}

function renderSync(s) {
  const pill = $('sync');
  pill.textContent = s.state;
  pill.className = `pill ${s.state}`;
  const bits = [];
  if (s.pending) bits.push(`${s.pending} change(s) waiting to upload`);
  if (s.lastSyncAt) bits.push(`last synced ${new Date(s.lastSyncAt).toLocaleTimeString()}`);
  if (s.error) bits.push(s.error);
  if (s.state === 'unreachable') {
    bits.push('The database is not responding. If your Supabase project is on the free plan it may have been paused after a week without activity: open the Supabase dashboard, find the project and choose Restore. Your local data is safe and will upload afterwards.');
  }
  if (s.state === 'auth-required') bits.push('Please sign in again.');
  $('syncdetail').textContent = bits.join(' | ');
}

if (mode === 'cloud') {
  show('btn-sync', true); show('btn-resync', true); show('btn-signout', true);
  renderSync(store.sync.getStatus());
  const session = await auth.getSession();
  show('login', !session);
  auth.onAuthChange((_e, s) => show('login', !s));
} else {
  renderSync({ state: 'local', pending: 0 });
}

store.subscribe((e) => {
  if (e.type === 'sync') renderSync(e.status);
  if (e.type === 'change') renderCounts();
});
await renderCounts();

// ---- actions -----------------------------------------------------------------
$('btn-sync')?.addEventListener('click', () => store.sync.syncNow());
$('btn-resync')?.addEventListener('click', () => store.sync.fullResync());
$('btn-signout')?.addEventListener('click', async () => { await auth.signOut(); await store.resetCache(); });

$('btn-link').addEventListener('click', async () => {
  try {
    await auth.sendMagicLink($('email').value.trim());
    $('login-msg').textContent = 'Sent. Click the link, or type the 6-digit code below.';
  } catch (err) { $('login-msg').innerHTML = `<span class="err">${err.message}</span>`; }
});
$('btn-code').addEventListener('click', async () => {
  try {
    await auth.verifyCode($('email').value.trim(), $('code').value);
    $('login-msg').textContent = 'Signed in.';
  } catch (err) { $('login-msg').innerHTML = `<span class="err">${err.message}</span>`; }
});

$('btn-add').addEventListener('click', async () => {
  const name = $('new-name').value.trim();
  if (!name) return;
  await store.upsert('items', { name });
  $('new-name').value = '';
});

$('where').addEventListener('input', async (e) => {
  const q = e.target.value.trim();
  if (!q) { $('where-out').textContent = ''; return; }
  const hits = whereIs({
    items: await store.list('items'),
    locations: await store.list('locations'),
    categories: await store.list('categories'),
  }, q);
  $('where-out').textContent = hits.length
    ? hits.map((h) => `${h.name}${h.quantity > 1 ? ` x${h.quantity}` : ''}  ->  ${h.answer}`).join('\n')
    : 'Nothing found.';
});

$('btn-export').addEventListener('click', async () => downloadBackup(await exportAll(store)));
$('btn-import').addEventListener('click', async () => {
  const file = $('file').files[0];
  if (!file) { $('backup-out').textContent = 'Choose a backup file first.'; return; }
  try {
    const summary = await importAll(store, JSON.parse(await file.text()), { mode: 'merge' });
    $('backup-out').textContent = JSON.stringify(summary, null, 2);
  } catch (err) { $('backup-out').innerHTML = `<span class="err">${err.message}</span>`; }
});
</script>
</body>
</html>
